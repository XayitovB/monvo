<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="100%" stop-color="#1F4A2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2F6B3F"/>
      <stop offset="100%" stop-color="#4ea060"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative cards -->
  <g transform="translate(820, 220) rotate(-10)" opacity="0.92">
    <rect x="0" y="0" width="280" height="180" rx="22" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.55"/>
  </g>
  <g transform="translate(870, 270) rotate(8)">
    <rect x="0" y="0" width="280" height="180" rx="22" fill="url(#accent)"/>
    <circle cx="48" cy="92" r="14" fill="#FFFFFF"/>
    <rect x="76" y="84" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
    <rect x="76" y="98" width="60" height="4" rx="2" fill="#FFFFFF" opacity="0.5"/>
    <rect x="24" y="140" width="180" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Wordmark + tagline -->
  <g fill="#FFFFFF" font-family="-apple-system, 'Segoe UI', Inter, sans-serif">
    <text x="80" y="200" font-size="42" font-weight="500" opacity="0.7">QR Loyalty Platformasi</text>
    <text x="80" y="340" font-size="120" font-weight="700" letter-spacing="-4">Monvo</text>
    <text x="80" y="420" font-size="34" font-weight="400" opacity="0.85">Mijozlar sodiqligi —</text>
    <text x="80" y="464" font-size="34" font-weight="400" opacity="0.85">o'zi ishlaydigan</text>
    <text x="80" y="558" font-size="22" font-weight="500" opacity="0.6">1 200+ biznes · Toshkent · Samarqand · Buxoro</text>
  </g>
