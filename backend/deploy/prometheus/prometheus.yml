global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'loyalty'
    env: 'production'

# ── Prometheus o'zini monitoring qilish ──────────────────────────────────────
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── FastAPI metrikalar ──────────────────────────────────────────────────────
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8000']
    # Docker compose scale uchun hamma nusxalar
    # dns_sd_configs:
    #   - names: ['tasks.app']
    #     type: 'A'
    #     port: 8000

  # ── Redis metrikalar ────────────────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']   # redis_exporter kerak

  # ── PostgreSQL metrikalar ───────────────────────────────────────────────────
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']  # postgres_exporter kerak

  # ── Nginx metrikalar ────────────────────────────────────────────────────────
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']    # nginx-prometheus-exporter kerak
