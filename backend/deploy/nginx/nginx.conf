###############################################################################
#  Nginx — monvo.uz production config
#
#  Yo'nalishlar:
#    monvo.uz/*         → FastAPI backend (port 8000)
#    HTTP (80)           → 301 → HTTPS (443)
#
#  SSL: /etc/nginx/ssl/monvo.uz/{fullchain,privkey}.pem
#  Certbot — host VPS da, sertifikatlar `./deploy/nginx/ssl/` ga ko'chiriladi.
###############################################################################

worker_processes auto;             # 8 vCPU = 8 worker
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;       # 8 worker × 8192 = 65k concurrent
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limit zonalar
    # api — backend so'rovlari uchun (10 so'rov/soniya)
    # static — frontend asset uchun (50 so'rov/soniya)
    limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

    # FastAPI upstream — keepalive bilan
    upstream fastapi_backend {
        least_conn;
        server app:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS yo'naltirish ───────────────────────────────────────────
    server {
        listen 80;
        server_name monvo.uz www.monvo.uz app.monvo.uz;

        # Let's Encrypt verification (renewal uchun)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name monvo.uz www.monvo.uz app.monvo.uz;

        ssl_certificate     /etc/nginx/ssl/monvo.uz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/monvo.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Xavfsizlik headerlari
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # Voice fayllari uchun katta yuklash
        client_max_body_size 25M;

        # Statik fayllar — yumshoq limit, agressiv cache
        location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
            limit_req zone=static burst=100 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Brauzer cache — 7 kun
            expires 7d;
            add_header Cache-Control "public, immutable" always;
        }

        # API va sahifalar
        location / {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
